# cargo-deny configuration (SEC-05, OSS-01).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # proc-macro-error (unmaintained) comes in through gtk-rs 0.18, the GTK 3 bindings Tauri 2 uses
  # on Linux (tray-icon, wry). Tauri 2.x has no GTK 4 port, so there is nothing to upgrade to.
  { id = "RUSTSEC-2024-0370", reason = "Linux GTK 3 stack of Tauri 2; no fixed version in Tauri 2.x" },
  # ttf-parser (unmaintained) comes in through ab_glyph 0.2.32 (latest), used only by pg-testkit
  # for tests and pg-bench; it never ships in the app.
  { id = "RUSTSEC-2026-0192", reason = "via ab_glyph (latest) in pg-testkit, dev/bench only; no fix upstream" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",          # cssparser, dtoa-short etc. via Tauri (file-level copyleft, PLAN §8)
  "CDLA-Permissive-2.0",
  "OpenSSL",          # aws-lc
  "BSL-1.0",          # clipboard-win, error-code via arboard (REN-05 copy); permissive, OSI
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies have no version; allowed because every crate is `publish = false`.
allow-wildcard-paths = true
# openssl would bypass rustls (SEC-03).
deny = [{ name = "openssl" }, { name = "openssl-sys" }, { name = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
