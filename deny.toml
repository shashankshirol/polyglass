# cargo-deny configuration (SEC-05, OSS-01).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",          # Bergamot (file-level copyleft, PLAN §8)
  "CDLA-Permissive-2.0",
  "OpenSSL",          # aws-lc
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# openssl would bypass rustls (SEC-03).
deny = [{ name = "openssl" }, { name = "openssl-sys" }, { name = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
