# cargo-deny configuration (SEC-05, OSS-01).

[graph]
all-features = true
# v1 ships on Windows only; dependencies of other targets (Tauri's Linux GTK stack, macOS crates)
# aren't checked. Add a target here when its platform comes back.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # ttf-parser (unmaintained) comes in through ab_glyph 0.2.32 (latest), used only by pg-testkit
  # for tests and pg-bench; it never ships in the app.
  { id = "RUSTSEC-2026-0192", reason = "via ab_glyph (latest) in pg-testkit, dev/bench only; no fix upstream" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",          # cssparser, dtoa-short etc. via Tauri (file-level copyleft, PLAN §8)
  "BSL-1.0",         # clipboard-win, error-code via arboard (REN-05 copy); permissive, OSI
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies have no version; allowed because every crate is `publish = false`.
allow-wildcard-paths = true
# openssl would bypass rustls (SEC-03).
deny = [{ name = "openssl" }, { name = "openssl-sys" }, { name = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
