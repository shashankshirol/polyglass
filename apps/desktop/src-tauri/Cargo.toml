[package]
name = "polyglass-desktop"
description = "Polyglass desktop shell: the lens window (Tauri 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "polyglass"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pg-core.workspace = true
pg-capture = { workspace = true, default-features = false }
pg-ocr.workspace = true
pg-translate.workspace = true
pg-pipeline.workspace = true
serde.workspace = true
serde_json.workspace = true
# `macos-private-api` is needed for transparent windows on macOS (PLAN §5; rules out the Mac App Store).
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
