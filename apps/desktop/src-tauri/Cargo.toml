[package]
name = "polyglass-desktop"
description = "Polyglass desktop shell: the lens window (Tauri 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "polyglass"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# REN-05 copy. No image support: the lens copies text only.
arboard = { version = "3", default-features = false }
pg-core.workspace = true
pg-capture.workspace = true
pg-ocr.workspace = true
pg-translate.workspace = true
pg-pipeline.workspace = true
pg-models.workspace = true
pg-ct2.workspace = true
# `--debug-dump-frames` (M1-APP-10) writes PNGs; the workspace's PNG-only build.
image.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["tray-icon"] }
# HK-01 hotkeys, registered from Rust only (the webview gets no permission for them).
tauri-plugin-global-shortcut = "2"
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    # HK-02: the AltGr check names the keyboard layout's language.
    "Win32_Globalization",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
