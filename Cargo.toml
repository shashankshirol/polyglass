[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
# Tentative pending owner decision D-2 (see CHECKLIST.md).
license = "MIT OR Apache-2.0"
repository = "https://github.com/polyglass/polyglass"
publish = false

[workspace.dependencies]
pg-core = { path = "crates/pg-core" }
pg-capture = { path = "crates/pg-capture" }
pg-ocr = { path = "crates/pg-ocr" }
pg-translate = { path = "crates/pg-translate" }
pg-pipeline = { path = "crates/pg-pipeline" }
pg-models = { path = "crates/pg-models" }
pg-bergamot = { path = "crates/pg-bergamot" }
pg-testkit = { path = "crates/pg-testkit" }

ab_glyph = "0.2"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Pure-Rust port of the Firefox Translations (Bergamot) engine, MPL-2.0 (ADR-0004). Features are
# chosen per target in pg-bergamot.
fxtranslate = { version = "0.5", default-features = false }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
lru = "0.19"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
# Same minor as Tauri 2.11 uses, so the app builds one copy.
windows = "0.61"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
