name: Release

# Builds the Windows installers from a version tag and stages a draft GitHub release (OSS-02,
# M5-2). Releases are built here and nowhere else, and only when a maintainer starts this
# workflow by hand: pushing a tag starts nothing (owner decision D-22). To release 0.1.0:
#
#   1. Set the version (Cargo.toml [workspace.package], apps/desktop/src-tauri/tauri.conf.json,
#      apps/desktop/package.json) and commit. Run the manual Windows CI job on that commit.
#   2. git tag -s v0.1.0 -m "Polyglass 0.1.0"      (a signed tag: -s, with a key GitHub knows)
#      git push origin main v0.1.0
#   3. Actions → Release → Run workflow, with the tag (v0.1.0) in the "tag" box
#      (or `gh workflow run release.yml -f tag=v0.1.0`).
#   4. Check the draft release this workflow creates, then publish it by hand.
#
# What is attached: the MSI and NSIS installers, THIRD_PARTY_NOTICES.md (OSS-01), two
# CycloneDX SBOMs (Rust crates, npm packages), the winget manifest files (not submitted
# anywhere) and SHA256SUMS over all of them. Build-provenance and SBOM attestations for the
# installers are stored by GitHub (`gh attestation verify <file> --repo <owner>/<repo>`).
#
# Like models-release.yml: the build job runs project code with read access only; the publish
# job, which can write, runs no project code and only attests and uploads what build staged.
#
# Code signing (OSS-04): SignPath Foundation (owner decision D-4, 2026-11-10). The "Sign" steps
# of the build job are skipped, and the installers stay unsigned, until the SignPath secrets
# exist. docs/RELEASING.md lists what the owner sets up.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The signed version tag to release, already pushed (for example v0.1.0)"
        required: true
        type: string

# One release at a time; a second start for the same tag waits instead of racing.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No global RUSTFLAGS: it would replace `.cargo/config.toml`'s `+crt-static` (see ci.yml).

jobs:
  checks:
    # SEC-05: a release is blocked on unresolved advisories. OSS-02: the tag must be signed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag, not the branch the workflow was started from. A name that isn't an
          # existing tag fails here.
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: The tag is annotated, signed and names the app's version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          # Repository variable; set it to "true" only to rehearse a release with an unsigned tag.
          ALLOW_UNSIGNED_TAG: ${{ vars.ALLOW_UNSIGNED_TAG }}
        run: |
          python3 scripts/release_assets.py check-version --tag "$TAG"
          type=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.type)
          sha=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)
          if [ "$type" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag; releases need a signed, annotated tag (git tag -s)"
            exit 1
          fi
          # GitHub checks the signature against the keys of the tagger's account.
          verified=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .verification.verified)
          reason=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .verification.reason)
          if [ "$verified" != "true" ]; then
            if [ "$ALLOW_UNSIGNED_TAG" = "true" ]; then
              echo "::warning::$TAG has no verified signature ($reason); allowed by ALLOW_UNSIGNED_TAG"
            else
              echo "::error::$TAG has no verified signature ($reason); OSS-02 needs a signed tag"
              exit 1
            fi
          fi
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: npm audit
        working-directory: apps/desktop
        run: npm audit --audit-level=high

  build:
    needs: checks
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Code signing is on once the SignPath secrets exist (see the "Sign" steps).
      SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' && secrets.SIGNPATH_PROJECT_SLUG != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag, not the branch the workflow was started from. A name that isn't an
          # existing tag fails here.
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # No rust-cache: a release is built from scratch.
      - name: Ninja
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
      - name: Release tools (cargo-about, cargo-cyclonedx)
        run: |
          cargo install cargo-about --locked --version 0.9.3 --features cli
          cargo install cargo-cyclonedx --locked --version 0.5.10
      - name: npm packages
        working-directory: apps/desktop
        run: npm ci
      # The Tauri CLI downloads WiX 3 and NSIS from their GitHub releases and checks their hashes.
      - name: Build the installers (MSI, NSIS)
        working-directory: apps/desktop
        run: npm run tauri build

      # --- Sign with SignPath Foundation (D-4, OSS-04) --------------------------------------
      # Off until the repository secrets SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID and
      # SIGNPATH_PROJECT_SLUG exist (docs/RELEASING.md says how to get them); without them the
      # release is built unsigned. Never run so far. The unsigned installers go up as one
      # artifact, SignPath fetches it from GitHub, checks that it comes from this workflow run,
      # and signs it once an approver has approved the request in SignPath (every Foundation
      # release needs that, hence the long wait). The signed files then replace the unsigned
      # ones, before anything is hashed, attested or staged.
      - name: "Sign: upload the unsigned installers"
        id: unsigned
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installers
          # Stored with their folders: msi/<name>.msi and nsis/<name>-setup.exe, which is what
          # the SignPath artifact configuration names.
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 1
      - name: "Sign: submit the signing request and wait for the signed installers"
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          # Repository variable; SignPath's usual name for the release policy otherwise.
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Time for the approver to approve the request by hand.
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: target/release/signed
      - name: "Sign: check the signatures and use the signed installers"
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          $pairs = @(
            @{ signed = "target/release/signed/msi"; dest = "target/release/bundle/msi"; filter = "*.msi" },
            @{ signed = "target/release/signed/nsis"; dest = "target/release/bundle/nsis"; filter = "*-setup.exe" })
          foreach ($p in $pairs) {
            $files = @(Get-ChildItem $p.signed -Filter $p.filter)
            if ($files.Count -ne 1) { throw "expected one signed $($p.filter) in $($p.signed), found $($files.Count)" }
            $sig = Get-AuthenticodeSignature $files[0].FullName
            if ($sig.Status -ne "Valid") { throw "$($files[0].Name): signature is $($sig.Status)" }
            "$($files[0].Name): signed by $($sig.SignerCertificate.Subject)"
            Copy-Item $files[0].FullName $p.dest -Force
          }
      # --------------------------------------------------------------------------------------

      # OSS-01: generated from the dependencies on every release.
      - name: THIRD_PARTY_NOTICES
        run: |
          mkdir -p release
          python scripts/notices.py --out release/THIRD_PARTY_NOTICES.md
      # Installers, SBOMs, winget manifests and SHA256SUMS; fails if an installer is over
      # SIZE-01 (15 MB).
      - name: Stage the release assets
        env:
          TAG: ${{ inputs.tag }}
        run: python scripts/release_assets.py stage --tag "$TAG" --bundle target/release/bundle --dest release ${{ env.SIGNING == 'true' && '--signed' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Check the staged files
        run: cd release && sha256sum --check --strict SHA256SUMS
      # OSS-02: build provenance for every installer, and the SBOMs attested to them.
      - name: Build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.msi
            release/*-setup.exe
      - name: SBOM attestation (Rust crates)
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.msi
            release/*-setup.exe
          sbom-path: release/polyglass-rust.cdx.json
      - name: SBOM attestation (npm packages)
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.msi
            release/*-setup.exe
          sbom-path: release/polyglass-ui.cdx.json
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::release $TAG already exists; app releases are never replaced"
            exit 1
          fi
          # A tag like v0.2.0-beta.1 becomes a pre-release.
          case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$TAG" --verify-tag --draft $pre \
            --title "Polyglass ${TAG#v}" --notes-file release/RELEASE_NOTES.md \
            $(find release -maxdepth 1 -type f ! -name RELEASE_NOTES.md | sort)
