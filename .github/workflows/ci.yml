name: CI

# v1 is Windows only. Pushes and pull requests run the checks that don't depend on the OS (fmt,
# the lens UI, cargo-deny) on cheap Linux runners. The Rust build, tests and MSRV check need
# Windows, whose runners count 2× against a private repository's Actions minutes, so on the
# owner's request they run only when started by hand: Actions → CI → Run workflow (or
# `gh workflow run ci.yml`), e.g. for large changes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No global RUSTFLAGS: it would replace the `+crt-static` flag that `.cargo/config.toml` sets
  # for Windows (CTranslate2 links the static MSVC runtime). Clippy runs with `-D warnings`.

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    # QUAL-01: clippy + unit, fixture and pipeline tests.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Windows runners ship Visual Studio (MSVC) and CMake. `.cargo/config.toml` selects Ninja,
      # and cmake-rs hands CMake the MSVC environment, so no developer prompt is needed (ADR-0005).
      - name: Ninja
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
      - name: C++ toolchain for CTranslate2 (pg-ct2)
        shell: bash
        run: |
          cmake --version
          ninja --version
          "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property displayName
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: pg-bench smoke run
        run: cargo run --release -p pg-bench -- --fixture tests/fixtures/ui-dialog-sv --runs 20

  bench:
    # QUAL-02: fail on a > 20% regression of pg-bench's p50 against main. Both versions are
    # built and run on this runner, one after the other, because runner hardware varies too
    # much to compare with stored numbers. On main the baseline is the commit before; on a
    # branch, the commit where it left main.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ninja
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
      - name: Build pg-bench at the baseline and at this commit
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then base=$(git rev-parse HEAD^); else base=$(git merge-base HEAD origin/main); fi
          echo "baseline: $(git log -1 --format='%h %s' "$base")" | tee -a "$GITHUB_STEP_SUMMARY"
          git worktree add ../base "$base"
          # One target directory, so the dependencies (CTranslate2 among them) are built once.
          (cd ../base && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --release -p pg-bench)
          cp target/release/pg-bench.exe target/pg-bench-base.exe
          cargo build --release -p pg-bench
      - name: Compare p50 (pipeline overhead with mock stages; capture → Windows OCR → grouping)
        run: scripts/bench-gate.sh target/pg-bench-base.exe target/release/pg-bench.exe | tee -a "$GITHUB_STEP_SUMMARY"

  scripts:
    # The release scripts' own tests (standard library only).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts -p "test_*.py" -v

  msrv:
    # D-6: rust-version = 1.90.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - name: Ninja
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
      - run: cargo check --workspace --all-targets

  ui:
    # Lens UI (apps/desktop): type-check, bundle, unit tests, audit npm dependencies.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=moderate

  deny:
    # SEC-05: advisories + licenses, for the Windows target (`deny.toml` [graph]).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
