name: CI

# Pushes and pull requests run everything on Linux only. Windows and macOS runners count 2× and
# 10× against a private repository's Actions minutes, so their test jobs run only when started by
# hand: Actions → CI → Run workflow (or `gh workflow run ci.yml -f os=all`), e.g. for large changes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: Which OSes the test job runs on
        type: choice
        default: all
        options: [all, windows, macos, linux]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No global RUSTFLAGS: it would replace the `+crt-static` flag that `.cargo/config.toml` sets
  # for Windows (CTranslate2 links the static MSVC runtime). Clippy runs with `-D warnings`.

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    # QUAL-01: clippy + unit, fixture and pipeline tests; Linux on every push, Windows and macOS
    # on a manual run (see `on:` above).
    strategy:
      fail-fast: false
      matrix:
        # push/PR or os=linux → Linux; os=windows / os=macos → that OS; os=all → all four.
        os: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.os == 'linux') && '["ubuntu-latest"]' || inputs.os == 'windows' && '["windows-latest"]' || inputs.os == 'macos' && '["macos-latest","macos-13"]' || '["ubuntu-latest","windows-latest","macos-latest","macos-13"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux webview and tray libraries (apps/desktop, Tauri 2), CMake and C++
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev cmake g++
      - name: CMake (macOS; Xcode's clang is the C++ compiler)
        if: runner.os == 'macOS'
        run: command -v cmake || brew install cmake
      # Windows runners ship Visual Studio (MSVC) and CMake. `.cargo/config.toml` selects Ninja,
      # and cmake-rs hands CMake the MSVC environment, so no developer prompt is needed (ADR-0005).
      - name: Ninja (Windows)
        if: runner.os == 'Windows'
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
      - name: C++ toolchain for CTranslate2 (pg-ct2)
        shell: bash
        run: |
          cmake --version
          if [ "$RUNNER_OS" = Windows ]; then
            ninja --version
            "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property displayName
          else
            c++ --version
          fi
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: pg-bench smoke run
        run: cargo run --release -p pg-bench -- --fixture tests/fixtures/ui-dialog-sv --runs 20

  msrv:
    # D-6: rust-version = 1.90.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - name: Tauri libraries, CMake and C++
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev cmake g++
      - run: cargo check --workspace --all-targets

  ui:
    # Lens UI (apps/desktop): type-check, bundle, unit tests, audit npm dependencies.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=moderate

  deny:
    # SEC-05: advisories + licenses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
