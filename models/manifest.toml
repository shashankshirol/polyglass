# OPUS-MT release (transformer-align, SentencePiece 32k), converted with ctranslate2 4.8.4, int8.
version = "opus+bt-2021-04-30-ct2-int8"
license = "CC-BY-4.0"
attribution = "OPUS-MT swe-eng model opus+bt-2021-04-30 by Helsinki-NLP (Language Technology Research Group, University of Helsinki), CC-BY 4.0 (https://creativecommons.org/licenses/by/4.0/); converted to CTranslate2 int8 by Polyglass. J. Tiedemann and S. Thottingal, \"OPUS-MT – Building open translation services for the World\", EAMT 2020."
source_url = "https://github.com/Helsinki-NLP/Tatoeba-Challenge/tree/master/models/swe-eng"
files = [
  { name = "model.bin", size = 81875117, sha256 = "1971f05964f526a13c76df3f1178e522a7c42818243a1b8e5272877952ae65cc" },
  { name = "config.json", size = 231, sha256 = "95dabd564e6abdb470e95f9106766647d8dc59e1bc2a1517d292c0cee5ca5812" },
  { name = "shared_vocabulary.json", size = 1327665, sha256 = "27f6e96e3f8266da803bf91a5b120f375b6cd00676582450c8e55c233e0c6705" },
  { name = "source.spm", size = 811815, sha256 = "fb63614d9ec099e6fcbf1efd42cac97464c9017bc49a44181c986e9d4b18c6da" },
  { name = "target.spm", size = 799820, sha256 = "63d083fc4aafe025d3d7bc382cce13e3df54acb23e001a37f48535dbffc44700" },
  { name = "LICENSE", size = 18652, sha256 = "945fbcb37deca05bccd7c3ca0e261679f1f5373515504fdbad68f6f3cf6f49b9" },
]

