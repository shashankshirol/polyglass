# Swedish ↔ English on CTranslate2 (`pg-ct2`, ADR-0005): Helsinki-NLP's OPUS-MT models, converted
# from Marian `.npz` to CTranslate2 int8 by `scripts/models/opus_mt.py` (pinned converter, output
# SHA-256 checked). License: CC-BY-4.0, the LICENSE in each release zip (installed with the model).
# Import-only (no `url`) until the converted files are hosted (owner decision D-9): install them
# with `python scripts/models/opus_mt.py` (MDL-04).
#
# Inputs (official release zips):
#   sv→en https://object.pouta.csc.fi/Tatoeba-MT-models/swe-eng/opus%2Bbt-2021-04-30.zip
#         286052961 bytes, sha256 2c19bd94e20abc47fc8c58eefab1dcd5de7bd887c6f3eebe0aa15c809769cba1
