# Polyglass model manifest (MDL-02).
#
# The app downloads models ONLY from URLs listed here, and verifies every file against its
# SHA-256 before use; imported models (MDL-04) are verified the same way. Changes to this file are
# reviewed via PR; each entry must record the model's license and where it comes from (PLAN §8).
#
# Rules enforced by pg-models (Manifest::parse):
#   - https URLs only; source_url is https
#   - a model has a `url` for every file or for none (import-only until hosted)
#   - CC-BY licenses need an `attribution`
#   - file names are plain (no paths), unique per model; sizes > 0
#   - sha256 is 64 lowercase hex characters
#   - model ids are unique and filesystem-safe

schema_version = 1

# Swedish ↔ English on CTranslate2 (`pg-ct2`, ADR-0005): Helsinki-NLP's OPUS-MT models, converted
# from Marian `.npz` to CTranslate2 int8 by `scripts/models/opus_mt.py` (pinned converter, output
# SHA-256 checked). License: CC-BY-4.0, the LICENSE in each release zip (installed with the model).
# Import-only (no `url`) until the converted files are hosted (owner decision D-9): install them
# with `python scripts/models/opus_mt.py` (MDL-04).
#
# Inputs (official release zips):
#   sv→en https://object.pouta.csc.fi/Tatoeba-MT-models/swe-eng/opus%2Bbt-2021-04-30.zip
#         286052961 bytes, sha256 2c19bd94e20abc47fc8c58eefab1dcd5de7bd887c6f3eebe0aa15c809769cba1
#   en→sv https://object.pouta.csc.fi/Tatoeba-MT-models/eng-swe/opus%2Bbt-2021-04-14.zip
#         286201633 bytes, sha256 1446a6b6d6bcdc6e862eb0cedd733f781ed9d1ee88fbb0bdb2f324549f16b0f9

[[model]]
id = "opus-mt-sv-en"
engine = "ctranslate2"
source = "sv"
