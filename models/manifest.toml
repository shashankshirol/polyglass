# Polyglass model manifest (MDL-02).
#
# The app downloads models ONLY from URLs listed here, and verifies every file against its
# SHA-256 before use. Changes to this file are reviewed via PR; each entry must record the
# model's license and where it comes from (PLAN §8).
#
# Rules enforced by pg-models (Manifest::parse):
#   - https URLs only; source_url is https
#   - file names are plain (no paths), unique per model; sizes > 0
#   - sha256 is 64 lowercase hex characters
#   - model ids are unique and filesystem-safe
#
# Swedish ↔ English (MDL-01, SV-01): Mozilla's Firefox Translations models ("tiny" student
# architecture, int8 `intgemm.alphas`), run by the `bergamot` engine (`pg-bergamot`, ADR-0004).
# Files are kept gzip-compressed on disk exactly as downloaded and verified; the engine
# decompresses them when it loads. Uncompressed SHA-256 of the model files, from Mozilla's
# registry: sv-en 92d79e2725718b84aed486473bdfcbe6bba3e7094922d4bead8a121cfa346372,
# en-sv 65ea0db8e658435846f297384face62dbf1804cfc92de8388b0e368e6ecc25a7.

schema_version = 1

