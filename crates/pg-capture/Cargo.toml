[package]
name = "pg-capture"
description = "Screen capture trait and per-OS implementations for Polyglass."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
pg-core.workspace = true
image = { workspace = true, optional = true }

[features]
default = ["fixture"]
# FixtureCapturer: serve frames from an image file (tests, pg-bench).
fixture = ["dep:image"]

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
] }

[dev-dependencies]
pg-testkit.workspace = true

[target.'cfg(windows)'.dev-dependencies]
pg-ocr.workspace = true
windows = { workspace = true, features = [
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
